name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

# head_ref is set only on pull_request events, so a new push to a PR
# cancels its older run. Pushes to main and release runs (a called workflow
# sees its caller's github context) get the unique run_id and are never
# cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # On a pull request, decide which jobs its files need. Any other event (a
  # push to main, the release's workflow_call) runs everything. The path
  # lists are in docs/DEVELOPMENT.md ("What CI runs"); keep both in sync.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      node: ${{ steps.filter.outputs.node }}
      package: ${{ steps.filter.outputs.package }}
      postgres: ${{ steps.filter.outputs.postgres }}
      site: ${{ steps.filter.outputs.site }}
      links: ${{ steps.filter.outputs.links }}

    steps:
      # A pull_request checkout is the PR's test merge commit; depth 2 also
      # fetches its two parents, the base branch and the PR head.
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Filter changed files
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          everything='^(\.github/|\.gitignore$|\.gitattributes$|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|biome\.json$)'
          node='^(src/|test/|migrations/|scripts/|examples/|README\.md$|docs/guide/getting-started\.md$|tsconfig[^/]*\.json$|tsdown\.config\.ts$|vitest\.config\.ts$)'
          package='^(src/|migrations/|scripts/|tsconfig[^/]*\.json$|tsdown\.config\.ts$)'
          postgres='^(src/|test/|migrations/|vitest\.config\.ts$)'
          site='^(site/|CHANGELOG\.md$)'
          links='^(docs/|README\.md$|CHANGELOG\.md$|CONTRIBUTING\.md$|SECURITY\.md$|AGENTS\.md$|LICENSE$|examples/README\.md$|scripts/check-links\.mjs$)'

          files=''
          all=true
          if [ "$EVENT_NAME" = pull_request ]; then
            # The base is the merge commit's parent that is not the PR head,
            # whatever the parent order. Anything else runs every job.
            read -r -a parents <<< "$(git rev-list --parents -n 1 HEAD)"
            if [ "${#parents[@]}" -eq 3 ] && [ "${parents[2]}" = "$PR_HEAD_SHA" ]; then
              base=${parents[1]}
            elif [ "${#parents[@]}" -eq 3 ] && [ "${parents[1]}" = "$PR_HEAD_SHA" ]; then
              base=${parents[2]}
            else
              base=''
              echo "::warning::HEAD is not a merge of the PR head; running every job"
            fi
            if [ -n "$base" ]; then
              files="$(git diff --name-only "$base" HEAD)"
              all=false
              echo "::group::Changed files"
              printf '%s\n' "$files"
              echo "::endgroup::"
              if grep -qE "$everything" <<< "$files"; then all=true; fi
            fi
          fi

          for job in node package postgres site links; do
            run=$all
            if [ "$run" = false ] && grep -qE "${!job}" <<< "$files"; then
              run=true
            fi
            echo "$job=$run" >> "$GITHUB_OUTPUT"
            echo "$job: $run"
          done

  validate:
    name: Node ${{ matrix.node-version }}
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.18
          - 24
          - 26

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Lint and the type-level checks run once, in the Checks job.
      - name: Test
        run: pnpm run test:ci

  # Lint and type checks do not depend on the Node version, so they run
  # once here instead of in each Node job.
  checks:
    name: Checks
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types
        run: pnpm checktypes

      - name: Lint
        run: pnpm lint

      - name: Type-check exports, README and examples
        run: pnpm run test:checks

  package:
    name: Package
    needs: changes
    if: needs.changes.outputs.package == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint packed tarball
        run: pnpm run lint:package

  site:
    name: Site
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The root lint checks site/ with site/biome.json, like the site's own
      # lint, but also fails on warnings. A site-only PR skips the Node jobs,
      # so without it a warning would first fail on main.
      - name: Lint
        run: pnpm lint

      - name: Check types
        run: pnpm --filter site typecheck

      - name: Test
        run: pnpm --filter site test

      - name: Build
        run: pnpm --filter site build

  # Relative links and #anchors in the Markdown. It needs only the checkout
  # (the script lists files with git ls-files) and github-slugger.
  links:
    name: Links
    needs: changes
    if: needs.changes.outputs.links == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check links
        run: pnpm run test:links

  postgres-integration:
    name: Postgres ${{ matrix.postgres }} integration (postgres.js ${{ matrix.postgres-js }})
    needs: changes
    if: needs.changes.outputs.postgres == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        postgres:
          - 17
          - 18
        postgres-js:
          - 3
          - 4
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # psql runs inside the service container, so the runner needs no
      # PostgreSQL client. job.services.<id>.id is the container's id.
      - name: Enable pgvector
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: docker exec "$POSTGRES_CONTAINER" psql -U postgres -d postgres -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Test integration
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          POSTGRES_JS: ${{ matrix.postgres-js }}
        run: pnpm run test:integration

  # One check that sums up the run: a job skipped by its if reports success,
  # so this fails only when a job that ran failed or was cancelled.
  ci-ok:
    name: CI ok
    needs:
      - changes
      - validate
      - checks
      - package
      - site
      - links
      - postgres-integration
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          case " $RESULTS " in
            *" failure "* | *" cancelled "*)
              echo "::error::A CI job failed or was cancelled"
              exit 1
              ;;
          esac

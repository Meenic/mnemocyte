name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:
    inputs:
      release:
        description: Set by release.yml to skip the Site job
        type: boolean
        default: false

permissions:
  contents: read

# head_ref is set only on pull_request events, so a new push to a PR
# cancels its older run. Pushes to main and release runs (a called workflow
# sees its caller's github context) get the unique run_id and are never
# cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # On a pull request, decide which jobs its files need. Any other event (a
  # push to main, the release's workflow_call) runs everything, except that
  # the release skips Site (inputs.release). The path lists are in
  # docs/DEVELOPMENT.md ("What CI runs"); keep both in sync.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      node: ${{ steps.filter.outputs.node }}
      package: ${{ steps.filter.outputs.package }}
      postgres: ${{ steps.filter.outputs.postgres }}
      libsql: ${{ steps.filter.outputs.libsql }}
      site: ${{ steps.filter.outputs.site }}
      links: ${{ steps.filter.outputs.links }}
      release: ${{ steps.filter.outputs.release }}
      mcp: ${{ steps.filter.outputs.mcp }}

    steps:
      # A pull_request checkout is the PR's test merge commit; depth 2 also
      # fetches its two parents, the base branch and the PR head.
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Filter changed files
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RELEASE: ${{ inputs.release }}
        run: |
          everything='^(\.github/|\.gitignore$|\.gitattributes$|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|biome\.json$|packages/mnemocyte/package\.json$|examples/package\.json$)'
          node='^(packages/mnemocyte/|packages/loader/|examples/|README\.md$|LICENSE$|docs/guide/getting-started\.md$)'
          package='^(packages/mnemocyte/(src/|migrations/|scripts/|tsconfig[^/]*\.json$|tsdown\.config\.ts$)|packages/loader/(src/|package\.json$)|README\.md$|LICENSE$)'
          postgres='^packages/mnemocyte/(src/|test/|migrations/|vitest\.config\.ts$)'
          libsql='^packages/mnemocyte/(src/|test/|migrations/|vitest\.config\.ts$)'
          site='^(apps/site/|packages/release/|CHANGELOG\.md$)'
          links='^(docs/|README\.md$|CHANGELOG\.md$|CONTRIBUTING\.md$|SECURITY\.md$|AGENTS\.md$|LICENSE$|examples/README\.md$|apps/site/AGENTS\.md$|scripts/|tsconfig\.json$|packages/mcp/(README|CHANGELOG)\.md$)'
          mcp='^(packages/mcp/|packages/loader/|packages/mnemocyte/src/|LICENSE$)'
          release='^(packages/release/|CHANGELOG\.md$|packages/mcp/(CHANGELOG\.md|package\.json)$)'

          files=''
          all=true
          if [ "$EVENT_NAME" = pull_request ]; then
            # The base is the merge commit's parent that is not the PR head,
            # whatever the parent order. Anything else runs every job.
            read -r -a parents <<< "$(git rev-list --parents -n 1 HEAD)"
            if [ "${#parents[@]}" -eq 3 ] && [ "${parents[2]}" = "$PR_HEAD_SHA" ]; then
              base=${parents[1]}
            elif [ "${#parents[@]}" -eq 3 ] && [ "${parents[1]}" = "$PR_HEAD_SHA" ]; then
              base=${parents[2]}
            else
              base=''
              echo "::warning::HEAD is not a merge of the PR head; running every job"
            fi
            if [ -n "$base" ]; then
              files="$(git diff --name-only "$base" HEAD)"
              all=false
              echo "::group::Changed files"
              printf '%s\n' "$files"
              echo "::endgroup::"
              if grep -qE "$everything" <<< "$files"; then all=true; fi
            fi
          fi

          for job in node package postgres libsql site links mcp release; do
            run=$all
            if [ "$run" = false ] && grep -qE "${!job}" <<< "$files"; then
              run=true
            fi
            # The site is not in the npm tarball, and the release PR and the
            # push to main already ran it.
            if [ "$job" = site ] && [ "$RELEASE" = true ]; then
              run=false
            fi
            echo "$job=$run" >> "$GITHUB_OUTPUT"
            echo "$job: $run"
          done

  validate:
    name: Node ${{ matrix.node-version }}
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.18
          - 24
          - 26

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Lint and the type-level checks run once, in the Checks job.
      - name: Test
        run: pnpm run test:ci

      # @mnemocyte/loader, which both bins bundle: its unit tests, on each
      # Node version the bins support.
      - name: Test the memory file loader
        run: pnpm run test:loader

  # Lint and type checks do not depend on the Node version, so they run
  # once here instead of in each Node job.
  checks:
    name: Checks
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types
        run: pnpm checktypes

      - name: Lint
        run: pnpm lint

      - name: Type-check exports, README and examples
        run: pnpm run test:checks

  package:
    name: Package
    needs: changes
    if: needs.changes.outputs.package == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint packed tarball
        run: pnpm run lint:package

  site:
    name: Site
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The root lint checks apps/site/ with apps/site/biome.json, like the
      # site's own lint, but also fails on warnings. A site-only PR skips the
      # Node jobs, so without it a warning would first fail on main.
      - name: Lint
        run: pnpm lint

      - name: Check types
        run: pnpm --filter site typecheck

      - name: Test
        run: pnpm --filter site test

      - name: Build
        run: pnpm --filter site build

  # Relative links and #anchors in the Markdown, and the types of the root
  # scripts/. It needs only the checkout (the script lists files with git
  # ls-files), github-slugger and TypeScript.
  links:
    name: Links
    needs: changes
    if: needs.changes.outputs.links == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A PR that changes only the root scripts/ runs no other job: the
      # Checks job's `pnpm checktypes` runs only with the Node jobs.
      - name: Check script types
        run: pnpm run checktypes:scripts

      - name: Check links
        run: pnpm run test:links

  # The release scripts' tests and `pnpm release:check`: each package's
  # version has its changelog heading (which the release text reads) and
  # link (which the next release's compare link reads), and every entry
  # has a lead-in that ends with a period. release.yml runs it too.
  release:
    name: Release check
    needs: changes
    if: needs.changes.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types
        run: pnpm run checktypes:release

      - name: Test and check the changelogs
        run: pnpm run test:release

  postgres-integration:
    name: Postgres ${{ matrix.postgres }} integration (postgres.js ${{ matrix.postgres-js }})
    needs: changes
    if: needs.changes.outputs.postgres == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        postgres:
          - 17
          - 18
        postgres-js:
          - 3
          - 4
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # psql runs inside the service container, so the runner needs no
      # PostgreSQL client. job.services.<id>.id is the container's id.
      - name: Enable pgvector
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: docker exec "$POSTGRES_CONTAINER" psql -U postgres -d postgres -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Test integration
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          POSTGRES_JS: ${{ matrix.postgres-js }}
        run: pnpm run test:integration

  # The shared contract on a libSQL server (sqld) over HTTP, the Hrana
  # protocol Turso users connect with: batches travel as requests and the
  # server parses the SQL itself. The image is pinned by its commit-SHA tag
  # and digest, and bumped by hand: Dependabot's github-actions updates
  # cover `uses:` references, not service images (decision 71).
  libsql-remote:
    name: libSQL server integration
    needs: changes
    if: needs.changes.outputs.libsql == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      sqld:
        image: ghcr.io/tursodatabase/libsql-server:d6c75af@sha256:6dd3eb276d9d3604e4a48ac4a999a2e267814732d57d7e94c04ba71482333a67
        env:
          SQLD_NODE: primary
        ports:
          - 8080:8080

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The image has no curl or wget for a --health-cmd, so the runner
      # polls the server's /health route instead. Without health options a
      # service counts as started once its container runs. --retry-all-errors
      # also retries the reset or empty reply Docker's port proxy can give
      # before sqld listens, which plain --retry does not.
      - name: Wait for sqld
        run: curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 1 --output /dev/null http://127.0.0.1:8080/health

      - name: Test libSQL server
        env:
          LIBSQL_URL: http://127.0.0.1:8080
        run: pnpm run test:integration:libsql

  # The contract over Neon's serverless driver (HTTP and the WebSocket Pool)
  # through the local Neon proxy, the setup Neon's local-development guide
  # documents, in front of the pinned pgvector image (decision 76). The proxy
  # has no releases: its image is pinned by digest and bumped by hand, like
  # the sqld image above.
  neon-http:
    name: Neon HTTP integration
    needs: changes
    if: needs.changes.outputs.postgres == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEON_PROXY_IMAGE: ghcr.io/timowilhelm/local-neon-http-proxy:main@sha256:cd2ae14edf2feafbc3330492de5c80506f77274c3bd013154cdef697bdeb768a
      # The connection string's host names the proxy's endpoint. The steps
      # build the string around this variable: GitGuardian's PostgreSQL
      # detector skips local hosts but takes db.localtest.me for a real one,
      # and flags the service's throwaway login next to it.
      NEON_HOST: db.localtest.me
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enable pgvector
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: docker exec "$POSTGRES_CONTAINER" psql -U postgres -d postgres -c "CREATE EXTENSION IF NOT EXISTS vector;"

      # The proxy image is a debug build (a 628 MB binary) that checks the
      # password with SCRAM on every HTTP request; at Postgres's default of
      # 4096 rounds that made each query take about 130 ms, and at 1 round
      # about 22 ms. The login is a throwaway one, so its hash strength does
      # not matter. psql reads the password from the container's own
      # POSTGRES_PASSWORD, so it is not written out here.
      - name: Store the password with one SCRAM round
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          SET scram_iterations = 1;
          \getenv password POSTGRES_PASSWORD
          ALTER ROLE postgres PASSWORD :'password';
          SQL

      # The proxy runs psql against Postgres once when it starts and exits if
      # that fails, so it starts here, after the service is healthy, on the
      # service's network, rather than as a service container that may start
      # first. GitHub documents the service's label as a hostname for the
      # job's own container only, so the proxy gets the service's address.
      - name: Start the Neon proxy
        env:
          NETWORK: ${{ job.services.postgres.network }}
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          address="$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$POSTGRES_CONTAINER")"
          docker run --detach --name neon-proxy --network "$NETWORK" \
            --publish 4444:4444 \
            --env "PG_CONNECTION_STRING=postgres://postgres:postgres@$address:5432/postgres" \
            "$NEON_PROXY_IMAGE"

      # The image has no health check; a query over HTTP is the readiness
      # probe. The host name in the connection string names the endpoint and
      # is never resolved, so the runner needs no DNS for localtest.me.
      - name: Wait for the Neon proxy
        run: >-
          curl --fail --silent --show-error --retry 30 --retry-all-errors
          --retry-delay 1 --output /dev/null
          --header "Neon-Connection-String: postgres://postgres:postgres@$NEON_HOST:5432/postgres"
          --header "Content-Type: application/json"
          --data '{"query":"SELECT 1","params":[]}'
          http://127.0.0.1:4444/sql

      - name: Test Neon
        env:
          NEON_FETCH_ENDPOINT: http://127.0.0.1:4444/sql
          NEON_WS_PROXY: 127.0.0.1:4444/v2
        run: |
          export NEON_DATABASE_URL="postgres://postgres:postgres@$NEON_HOST:5432/postgres"
          pnpm run test:integration:neon

      - name: Neon proxy logs
        if: failure()
        run: docker logs neon-proxy

  # @mnemocyte/mcp on each supported Node: the built bin loads a TypeScript
  # memory file through type stripping, which changed between them. It
  # builds mnemocyte first and uses its dist/, as an app would. Types, lint
  # and the packed tarball are checked once, on Node 24.
  mcp:
    name: MCP (Node ${{ matrix.node-version }})
    needs: changes
    if: needs.changes.outputs.mcp == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.18
          - 24
          - 26

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm run test:mcp

      - name: Check types
        if: matrix.node-version == 24
        run: pnpm run checktypes:mcp

      - name: Lint
        if: matrix.node-version == 24
        run: pnpm lint

      - name: Lint packed tarball
        if: matrix.node-version == 24
        run: pnpm run lint:package:mcp

  # One check that sums up the run: a job skipped by its if reports success,
  # so this fails only when a job that ran failed or was cancelled.
  ci-ok:
    name: CI ok
    needs:
      - changes
      - validate
      - checks
      - package
      - site
      - links
      - release
      - postgres-integration
      - libsql-remote
      - neon-http
      - mcp
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          case " $RESULTS " in
            *" failure "* | *" cancelled "*)
              echo "::error::A CI job failed or was cancelled"
              exit 1
              ;;
          esac
